# This is a basic workflow to help you get started with Actions

name: CI ADDONS

########################################################################
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

#env:
#  HDF5_ROOT : /usr/lib/x86_64-linux-gnu/hdf5/serial/
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Define strategy matrix
    strategy:
      fail-fast: false
      matrix:
        compiler: ['gfortran','ifort']
        mode: ['RELEASE', 'DEBUG']
        comm: ['SEQUENTIAL']
        enable_threads: ['YES']
        mkl: ['YES','NO']
        exclude:
        - compiler: gfortran
          mkl: 'YES'          
        - compiler: ifort
          mkl: 'NO'          
    env:
      INTEL_COMPILER_DIR : /opt/intel/oneapi/compiler/2023.2.0
    # Steps represent a sequence of tasks that will be executed as part of the job

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Meshes repository and Gmsh (Python API), available to all the tests:
      #   $HORSES3D_MESHES_DIR : clone of https://github.com/horses-framework/horses3d-meshes
      #   $GMSH_PYTHON         : Python interpreter with the gmsh module, to run the mesh scripts
      - name: Checkout horses3d-meshes
        uses: actions/checkout@v3
        with:
          repository: horses-framework/horses3d-meshes
          path: horses3d-meshes

      - name: Install Gmsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa libgl1 libxcursor1 libxft2 libxinerama1 libfontconfig1
          python3 -m venv "$RUNNER_TEMP/gmsh-venv"
          "$RUNNER_TEMP/gmsh-venv/bin/pip" install -q gmsh
          echo "HORSES3D_MESHES_DIR=$GITHUB_WORKSPACE/horses3d-meshes" >> $GITHUB_ENV
          echo "GMSH_PYTHON=$RUNNER_TEMP/gmsh-venv/bin/python" >> $GITHUB_ENV

      # sudo apt-get install -qq pkg-config libhdf5-serial-dev
#      - name: Install Linux packages
#        run: |
#          sudo apt-get update
#          sudo apt install libhdf5-dev
#          dpkg -L libhdf5-dev

      # IF COMPILER = IFORT -> INSTALL IFORT #
      # UNCOMMENT TO USE CACHED IFORT 
      #- name: cache-intel-compilers
      #  if: (matrix.compiler == 'ifort')
      #  id: cache-intel-compilers
      #  uses: actions/cache@v3
      #  with:
      #    path: /opt/intel
      #    key: intel-${{ runner.os }}-compilers-b


      - name: Intel Apt repository
      # UNCOMMENT TO USE CACHED IFORT 
      #  if: (steps.cache-intel-compilers.outputs.cache-hit != 'true')
        run: |
          wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
          sudo apt-get update

      - name: Install Intel oneAPI
      # UNCOMMENT TO USE CACHED IFORT
      #  if: (steps.cache-intel-compilers.outputs.cache-hit != 'true')
      #  run: sudo apt-get install intel-oneapi-compiler-fortran intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mpi intel-oneapi-mpi-devel intel-oneapi-mkl-devel ninja-build
        run: sudo apt-get install intel-oneapi-compiler-fortran-2023.2.0 intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic-2023.2.0 intel-oneapi-mpi-2021.14 intel-oneapi-mpi-devel-2021.14 intel-oneapi-mkl-devel ninja-build
      # Runs a single command using the runners shell
      ##- name: Install gfortran
      ##  run: |
      ##   sudo add-apt-repository ppa:ubuntu-toolchain-r/test
      ##   sudo apt update
      ##   sudo apt-get install gfortran-9

      ##- name: Show gfortran version
      ##  run: gfortran-9 --version

      - name: Show ${{matrix.compiler}} version
        run: |
          source /opt/intel/oneapi/setvars.sh || true
          printenv >> $GITHUB_ENV
          ${{matrix.compiler}} --version

      - name: Configure
        working-directory: ./Solver
        run: ./configure

      - name: Compile horses3d
        working-directory: ./Solver
        run: |
         source /opt/intel/oneapi/setvars.sh || true
         make allclean MODE=${{matrix.mode}} COMPILER=${{matrix.compiler}} COMM=${{matrix.comm}} ENABLE_THREADS=${{matrix.enable_threads}} WITH_MKL=${{matrix.mkl}}
         make MODE=${{matrix.mode}} COMPILER=${{matrix.compiler}} COMM=${{matrix.comm}} ENABLE_THREADS=${{matrix.enable_threads}} WITH_MKL=${{matrix.mkl}}

          
########################################################################
#######                        ADDONS                           ########
########################################################################
#
# 1) Mapping Result - horsesConverter
# --------------------------------------------
      - name: Run horsesConverter_MappingResult
        working-directory: ./Solver/test/AddOns/horsesConverter/MappingResult
        run: |
          source /opt/intel/oneapi/setvars.sh || true
          ./horsesConverter
        if: '!cancelled()'

#
# 2) Horses Mesh to OpenFOAM - horsesConverter
# --------------------------------------------
      - name: Run horsesConverter_HorsesMesh2OF
        working-directory: ./Solver/test/AddOns/horsesConverter/HorsesMesh2OF
        run: |
          source /opt/intel/oneapi/setvars.sh || true
          ./horsesConverter
        if: '!cancelled()'

#
# 3) OpenFOAM to Horses - horsesConverter
# --------------------------------------------
      - name: Run horsesConverter_OF2Horses
        working-directory: ./Solver/test/AddOns/horsesConverter/OF2Horses
        run: |
          source /opt/intel/oneapi/setvars.sh || true
          OMP_NUM_THREADS=4 ./horsesConverter
        if: '!cancelled()'

#
# 4) Mesh interpolation - horses.tools
# ------------------------------------
#    The meshes are generated with the scripts of the horses3d-meshes repository (see the top of the file)
      - name: Generate MeshInterpolation meshes
        working-directory: ./Solver/test/AddOns/MeshInterpolation
        run: |
          mkdir -p MESH
          "$GMSH_PYTHON" "$HORSES3D_MESHES_DIR/cartesian-box/generate_cartesian_box_mesh.py" 4 3 2 --xlim 0 1 --ylim 0 2 --zlim 0 3 -o MESH/box_source.msh
          "$GMSH_PYTHON" "$HORSES3D_MESHES_DIR/cartesian-box/generate_cartesian_box_mesh.py" 3 2 1 --xlim 0 1 --ylim 0 2 --zlim 0 3 -o MESH/box_target.msh
        if: '!cancelled()'

      - name: Build MeshInterpolation
        working-directory: ./Solver/test/AddOns/MeshInterpolation/SETUP
        run: |
          source /opt/intel/oneapi/setvars.sh || true
          make MODE=${{matrix.mode}} COMPILER=${{matrix.compiler}} COMM=${{matrix.comm}} ENABLE_THREADS=${{matrix.enable_threads}} WITH_MKL=${{matrix.mkl}}
        if: '!cancelled()'

      - name: Run MeshInterpolation
        working-directory: ./Solver/test/AddOns/MeshInterpolation
        run: |
          source /opt/intel/oneapi/setvars.sh || true
          ./horses3d.ns MeshInterpolation_source.control
          ./horses.tools MeshInterpolation_tool.control
          ./horses3d.ns MeshInterpolation_check.control
        if: '!cancelled()'
